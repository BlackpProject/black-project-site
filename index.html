<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Project</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      padding: 25px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
      background: linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.85)
      );
    }

    .hero p {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(55px, 10vw, 130px);
      line-height: .9;
      letter-spacing: -5px;
      max-width: 900px;
    }

    .hero button {
      width: fit-content;
      margin-top: 40px;
      padding: 16px 35px;
      background: #fff;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .products {
      padding: 80px 6%;
    }

    .products h2 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background: #111;
      padding: 20px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      color: #aaa;
    }

    footer {
      padding: 40px 6%;
      border-top: 1px solid #222;
      color: #777;
    }

    @media (max-width: 700px) {
      nav {
        display: none;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BLACK PROJECT</div>

    <nav>
      <a href="#">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#">Instagram</a>
    </nav>
  </header>

  <section class="hero">
    <p>Black Project — Portugal</p>

    <h1>YOUR<br>STYLE.<br>YOUR<br>PROJECT.</h1>

    <button onclick="document.getElementById('produtos').scrollIntoView()">
      Comprar agora
    </button>
  </section>

  <section class="products" id="produtos">

    <h2>Produtos em destaque</h2>

    <div class="grid">

      <div class="product">
        <h3>Óculos Black Project</h3>
        <p>€29,90</p>
      </div>

      <div class="product">
        <h3>Black Project Cap</h3>
        <p>€24,90</p>
      </div>

      <div class="product">
        <h3>Black Project T-Shirt</h3>
        <p>€34,90</p>
      </div>

    </div>

  </section>

  <footer>
    © 2026 Black Project — Portugal
  </footer>

</body>
</html>
